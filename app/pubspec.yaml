name: dailys
description: >
  Dailys - aplikasi produktivitas dan keuangan mahasiswa, offline-first (Flutter).
  Implementasi milestone M1 (Windows lokal: Activity + Tugas). Kontrak di
  ../schema.md, ../API-SPEC.md, ../PRD-Aplikasi-Produktivitas-Mahasiswa.md.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Dependency ditambahkan bertahap per langkah M1-PLAN. Langkah 2 (core determinisme)
# hanya butuh uuid + timezone. Bloc/Drift/go_router/l10n/notifikasi menyusul di
# langkah berikutnya agar pub get tetap bersih dan cepat.
dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.4.0            # UUIDv4 + UUIDv5 deterministik (schema "Deterministic IDs")
  timezone: ^0.9.4        # tzdb; kebijakan DST clamp diterapkan manual (schema 2, 23.1)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
