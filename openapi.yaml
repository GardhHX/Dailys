      required: [history_date, tugas]
      properties:
        history_date: { $ref: '#/components/schemas/LocalDate' }
        tugas:
          type: array
          items: { $ref: '#/components/schemas/TugasCard' }
    ChecklistMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        judul: { type: string, minLength: 1 }
        is_done: { type: boolean }
        urutan: { type: integer, minimum: 0 }
    ChecklistCreate:
      allOf:
        - $ref: '#/components/schemas/ChecklistMutation'
        - required: [judul]
    ActivityMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        occurrence_date: { $ref: '#/components/schemas/LocalDate' }
        judul: { type: string, minLength: 1 }
        activity_category_id: { $ref: '#/components/schemas/Uuid' }
        start_time:
          oneOf:
            - { $ref: '#/components/schemas/Instant' }
            - { type: 'null' }
        end_time:
          oneOf:
            - { $ref: '#/components/schemas/Instant' }
            - { type: 'null' }
        is_all_day: { type: boolean }
        status: { type: string, enum: [belum_mulai, selesai, dilewati] }
        reminder_offsets_minutes: { $ref: '#/components/schemas/ReminderOffsetsMinutes' }
        catatan: { type: [string, 'null'] }
      allOf:
        - if:
            required: [reminder_offsets_minutes]
            properties:
              reminder_offsets_minutes: { minItems: 1 }
          then:
            required: [start_time]
            properties:
              start_time: { $ref: '#/components/schemas/Instant' }
    ActivityCreate:
      allOf:
        - $ref: '#/components/schemas/ActivityMutation'
        - required: [occurrence_date, judul, activity_category_id, is_all_day, status]
    ActivityBulkMutation:
      type: object
      additionalProperties: false
      required: [ids, date]
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
        date: { $ref: '#/components/schemas/LocalDate' }
        target_date: { $ref: '#/components/schemas/LocalDate' }
    RecurrenceMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        judul: { type: string, minLength: 1 }
        activity_category_id: { $ref: '#/components/schemas/Uuid' }
        start_time:
          oneOf:
            - { $ref: '#/components/schemas/LocalTime' }
            - { type: 'null' }
        end_time:
          oneOf:
            - { $ref: '#/components/schemas/LocalTime' }
            - { type: 'null' }
        is_all_day: { type: boolean }
        recurring_days:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        starts_on: { $ref: '#/components/schemas/LocalDate' }
        ends_on:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        reminder_offsets_minutes: { $ref: '#/components/schemas/ReminderOffsetsMinutes' }
        catatan: { type: [string, 'null'] }
      allOf:
        - if:
            required: [reminder_offsets_minutes]
            properties:
              reminder_offsets_minutes: { minItems: 1 }
          then:
            required: [start_time]
            properties:
              start_time: { $ref: '#/components/schemas/LocalTime' }
    RecurrenceCreate:
      allOf:
        - $ref: '#/components/schemas/RecurrenceMutation'
        - required: [judul, activity_category_id, is_all_day, recurring_days, starts_on]
    PomodoroStart:
      type: object
      additionalProperties: false
      required: [start_time, durasi_menit, jenis]
      properties:
        tugas_id:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        habit_id:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        start_time: { $ref: '#/components/schemas/Instant' }
        durasi_menit: { type: integer, minimum: 1 }
        jenis: { type: string, enum: [fokus, istirahat_pendek, istirahat_panjang] }
      not:
        required: [tugas_id, habit_id]
        properties:
          tugas_id: { type: string }
          habit_id: { type: string }
    PomodoroSessionCommand:
      type: object
      additionalProperties: false
      required: [action, occurred_at]
      properties:
        action: { type: string, enum: [pause, resume, complete, cancel] }
        occurred_at: { $ref: '#/components/schemas/Instant' }
    TimeboxMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        judul: { type: string, minLength: 1 }
        activity_category_id: { $ref: '#/components/schemas/Uuid' }
        tugas_id:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        habit_id:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        hari: { type: [integer, 'null'], minimum: 1, maximum: 7 }
        tanggal_spesifik:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        start_time: { $ref: '#/components/schemas/LocalTime' }
        end_time: { $ref: '#/components/schemas/LocalTime' }
        is_recurring: { type: boolean }
        is_active: { type: boolean, default: true }
        reminder_offsets_minutes: { $ref: '#/components/schemas/ReminderOffsetsMinutes' }
      not:
        required: [tugas_id, habit_id]
        properties:
          tugas_id: { type: string }
          habit_id: { type: string }
    TimeboxCreate:
      allOf:
        - $ref: '#/components/schemas/TimeboxMutation'
        - required: [judul, activity_category_id, start_time, end_time, is_recurring]
      oneOf:
        - title: Recurring timebox
          required: [is_recurring, hari, tanggal_spesifik]
          properties:
            is_recurring: { const: true }
            hari: { type: integer, minimum: 1, maximum: 7 }
            tanggal_spesifik: { type: 'null' }
        - title: Ad-hoc timebox
          required: [is_recurring, hari, tanggal_spesifik]
          properties:
            is_recurring: { const: false }
            hari: { type: 'null' }
            tanggal_spesifik: { $ref: '#/components/schemas/LocalDate' }
    TimeboxExecutionCommand:
      type: object
      additionalProperties: false
      required: [occurrence_date, action]
      properties:
        execution_id:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        occurrence_date: { $ref: '#/components/schemas/LocalDate' }
        action:
          type: string
          enum: [start, complete, miss, skip, reschedule]
          description: The UI choice "masih berlaku" sends no command and leaves the execution pending.
        actual_start_at:
          oneOf:
            - { $ref: '#/components/schemas/Instant' }
            - { type: 'null' }
        actual_end_at:
          oneOf:
            - { $ref: '#/components/schemas/Instant' }
            - { type: 'null' }
        rescheduled_to:
          oneOf:
            - { $ref: '#/components/schemas/Instant' }
            - { type: 'null' }
        catatan: { type: [string, 'null'] }
      allOf:
        - if:
            properties: { action: { const: start } }
            required: [action]
          then:
            required: [actual_start_at]
            properties:
              actual_start_at: { $ref: '#/components/schemas/Instant' }
              actual_end_at: { type: 'null' }
              rescheduled_to: { type: 'null' }
        - if:
            properties: { action: { const: complete } }
            required: [action]
          then:
            required: [actual_end_at]
            properties:
              actual_end_at: { $ref: '#/components/schemas/Instant' }
              rescheduled_to: { type: 'null' }
        - if:
            properties: { action: { enum: [miss, skip] } }
            required: [action]
          then:
            properties:
              actual_start_at: { type: 'null' }
              actual_end_at: { type: 'null' }
              rescheduled_to: { type: 'null' }
        - if:
            properties: { action: { const: reschedule } }
            required: [action]
          then:
            required: [rescheduled_to]
            properties:
              rescheduled_to: { $ref: '#/components/schemas/Instant' }
              actual_start_at: { type: 'null' }
              actual_end_at: { type: 'null' }
    TimeboxMarkStatusCompatibilityCommand:
      type: object
      additionalProperties: false
      required: [occurrence_date, status]
      properties:
        execution_id: { type: [string, 'null'], format: uuid }
        occurrence_date: { $ref: '#/components/schemas/LocalDate' }
        status: { type: string, enum: [completed, missed, rescheduled] }
        actual_start_at: { type: [string, 'null'], format: date-time }
        actual_end_at: { type: [string, 'null'], format: date-time }
        rescheduled_to: { type: [string, 'null'], format: date-time }
        catatan: { type: [string, 'null'] }
      allOf:
        - if: { properties: { status: { const: completed } }, required: [status] }
          then:
            required: [actual_end_at]
            properties:
              actual_end_at: { $ref: '#/components/schemas/Instant' }
              rescheduled_to: { type: 'null' }
        - if: { properties: { status: { const: missed } }, required: [status] }
          then:
            properties:
              actual_start_at: { type: 'null' }
              actual_end_at: { type: 'null' }
              rescheduled_to: { type: 'null' }
        - if: { properties: { status: { const: rescheduled } }, required: [status] }
          then:
            required: [rescheduled_to]
            properties:
              actual_start_at: { type: 'null' }
              actual_end_at: { type: 'null' }
              rescheduled_to: { $ref: '#/components/schemas/Instant' }
    TimeboxExecution:
      allOf:
        - $ref: '#/components/schemas/EntityMetadata'
        - type: object
          required: [schedule_id, occurrence_date, planned_start_at, planned_end_at, status, actual_start_at, actual_end_at, rescheduled_to_id, activity_id, catatan]
          properties:
            schedule_id: { $ref: '#/components/schemas/Uuid' }
            occurrence_date: { $ref: '#/components/schemas/LocalDate' }
            planned_start_at: { $ref: '#/components/schemas/Instant' }
            planned_end_at: { $ref: '#/components/schemas/Instant' }
            status: { type: string, enum: [pending, completed, missed, skipped, rescheduled] }
            actual_start_at: { type: [string, 'null'], format: date-time }
            actual_end_at: { type: [string, 'null'], format: date-time }
            rescheduled_to_id: { type: [string, 'null'], format: uuid }
            activity_id: { type: [string, 'null'], format: uuid }
            catatan: { type: [string, 'null'] }
        - if:
            properties: { status: { const: pending } }
            required: [status]
          then:
            properties:
              actual_end_at: { type: 'null' }
              rescheduled_to_id: { type: 'null' }
        - if:
            properties: { status: { const: completed } }
            required: [status]
          then:
            properties:
              actual_start_at: { $ref: '#/components/schemas/Instant' }
              actual_end_at: { $ref: '#/components/schemas/Instant' }
              rescheduled_to_id: { type: 'null' }
              activity_id: { $ref: '#/components/schemas/Uuid' }
        - if:
            properties: { status: { enum: [missed, skipped] } }
            required: [status]
          then:
            properties:
              actual_start_at: { type: 'null' }
              actual_end_at: { type: 'null' }
              rescheduled_to_id: { type: 'null' }
              activity_id: { type: 'null' }
        - if:
            properties: { status: { const: rescheduled } }
            required: [status]
          then:
            properties:
              actual_start_at: { type: 'null' }
              actual_end_at: { type: 'null' }
              rescheduled_to_id: { $ref: '#/components/schemas/Uuid' }
              activity_id: { type: 'null' }
      unevaluatedProperties: false
    TimeboxExecutionCommandResult:
      type: object
      additionalProperties: false
      required: [execution, rescheduled_execution]
      properties:
        execution: { $ref: '#/components/schemas/TimeboxExecution' }
        rescheduled_execution:
          oneOf:
            - { $ref: '#/components/schemas/TimeboxExecution' }
            - { type: 'null' }
    TimeboxExecutionCommandEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, warning, error]
      properties:
        data: { $ref: '#/components/schemas/TimeboxExecutionCommandResult' }
        meta: { $ref: '#/components/schemas/Meta' }
        warning: { type: 'null' }
        error: { type: 'null' }
    TimeboxExecutionListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, warning, error]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TimeboxExecution' }
        meta: { $ref: '#/components/schemas/Meta' }
        warning: { type: 'null' }
        error: { type: 'null' }
    HabitMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nama: { type: string, minLength: 1 }
        target_hari:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        warna: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        icon: { type: string, minLength: 1 }
        max_izin_per_minggu: { type: integer, minimum: 0, default: 1 }
        schedule_effective_from:
          $ref: '#/components/schemas/LocalDate'
          description: Defaults to today and cannot be earlier than today in the user timezone when schedule fields change.
    HabitCreate:
      allOf:
        - $ref: '#/components/schemas/HabitMutation'
        - required: [nama, target_hari, warna]
    HabitSchedule:
      allOf:
        - $ref: '#/components/schemas/EntityMetadata'
        - type: object
          required: [habit_id, effective_from, effective_to, target_hari, max_izin_per_minggu, state]
          properties:
            habit_id: { $ref: '#/components/schemas/Uuid' }
            effective_from: { $ref: '#/components/schemas/LocalDate' }
            effective_to: { type: [string, 'null'], format: date }
            target_hari:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: integer, minimum: 1, maximum: 7 }
            max_izin_per_minggu: { type: integer, minimum: 0 }
            state: { type: string, enum: [active, paused] }
      unevaluatedProperties: false
    HabitScheduleListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, warning, error]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/HabitSchedule' }
        meta: { $ref: '#/components/schemas/Meta' }
        warning: { type: 'null' }
        error: { type: 'null' }
    HabitLogMutation:
      type: object
      additionalProperties: false
      required: [tanggal, status]
      properties:
        tanggal: { $ref: '#/components/schemas/LocalDate' }
        status: { type: string, enum: [done, skip, missed] }
        catatan: { type: [string, 'null'] }
    AccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nama: { type: string, minLength: 1 }
        tipe: { type: string, enum: [cash, bank, ewallet, custom] }
        saldo_awal: { type: integer, description: Editable only while the account has no active ledger transaction; otherwise use balance correction. }
        is_archived: { type: boolean, description: Archived accounts remain in history but reject new transactions. }
    AccountCreate:
      type: object
      additionalProperties: false
      required: [nama, tipe, saldo_awal]
      properties:
        nama: { type: string, minLength: 1 }
        tipe: { type: string, enum: [cash, bank, ewallet, custom] }
        saldo_awal: { type: integer }
    FinanceCategoryMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nama: { type: string, minLength: 1 }
        tipe: { type: string, enum: [income, expense] }
        icon: { type: [string, 'null'] }
        is_archived: { type: boolean, description: Archived categories remain in history but cannot be selected for new transactions. }
    FinanceCategoryCreate:
      allOf:
        - $ref: '#/components/schemas/FinanceCategoryMutation'
        - required: [nama, tipe]
    TransactionMutation:
      type: object
      additionalProperties: false
