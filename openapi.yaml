            X-Removal-Version: { $ref: '#/components/headers/RemovalVersion' }
            Link: { $ref: '#/components/headers/ReplacementLink' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeboxExecutionCommandEnvelope' }
