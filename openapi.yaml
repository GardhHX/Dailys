            review:
              type: 'null'
            conflict:
              const: false
      - if:
          properties:
            status:
              const: review_required
          required:
          - status
        then:
          properties:
            server_revision:
              type: 'null'
            replaced_revision:
              type: 'null'
            accepted_record:
              type: 'null'
            replaced_record:
              type: 'null'
            conflict:
              const: true
            merge_applied:
              const: false
            review:
              $ref: '#/components/schemas/SyncConflictReview'
            error:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - rejected
              - recovery_required
          required:
          - status
        then:
          properties:
            server_revision:
              type: 'null'
            replaced_revision:
              type: 'null'
            accepted_record:
              type: 'null'
            replaced_record:
              type: 'null'
            conflict:
              const: false
            merge_applied:
              const: false
            review:
              type: 'null'
            error:
              $ref: '#/components/schemas/SyncDeterministicError'
      - if:
          properties:
            status:
              const: recovery_required
          required:
          - status
        then:
          properties:
            error:
              allOf:
              - $ref: '#/components/schemas/SyncDeterministicError'
              - properties:
                  code:
                    const: BASE_REVISION_UNAVAILABLE
      - if:
          properties:
            status:
              const: rejected
          required:
          - status
        then:
          properties:
            error:
              allOf:
              - $ref: '#/components/schemas/SyncDeterministicError'
              - properties:
                  code:
                    not:
                      const: BASE_REVISION_UNAVAILABLE
      - if:
          properties:
            merge_applied:
              const: false
          required:
          - merge_applied
        then:
          properties:
            replaced_revision:
              type: 'null'
            replaced_record:
              type: 'null'
      - if:
          properties:
            merge_applied:
              const: true
          required:
          - merge_applied
        then:
          properties:
            status:
              enum:
              - accepted
              - duplicate
            replaced_revision:
              type: integer
              minimum: 1
            replaced_record:
              $ref: '#/components/schemas/SyncActiveEntityRecord'
