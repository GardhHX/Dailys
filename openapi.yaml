    WeeklyReviewCreate:
      type: object
      additionalProperties: false
      required: [id, week_start]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        week_start: { $ref: '#/components/schemas/LocalDate' }
    WeeklyReviewUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        evaluation_text: { type: string }
        next_week_focus_text: { type: string }
    WeeklyReviewCompleteCommand:
      type: object
      additionalProperties: false
      required: [completed_at, evaluation_text, next_week_focus_text]
      properties:
        completed_at: { $ref: '#/components/schemas/Instant' }
        evaluation_text: { type: string, minLength: 1 }
        next_week_focus_text: { type: string, minLength: 1 }
    WeeklyPlanDraftMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        target_type: { type: string, enum: [tugas, activity, timebox] }
        judul: { type: string, minLength: 1 }
        catatan: { type: [string, 'null'] }
        target_date: { $ref: '#/components/schemas/LocalDate' }
        source_entity_type: { type: [string, 'null'], enum: [tugas, activity, timebox_execution, null] }
        source_entity_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [draft, discarded] }
      dependentRequired:
        source_entity_type: [source_entity_id]
        source_entity_id: [source_entity_type]
      allOf:
        - if: { properties: { source_entity_type: { type: string } }, required: [source_entity_type] }
          then: { properties: { source_entity_id: { $ref: '#/components/schemas/Uuid' } } }
          else: { properties: { source_entity_id: { type: 'null' } } }
    WeeklyPlanDraftCreate:
      type: object
      additionalProperties: false
      required: [id, target_type, judul, target_date]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        target_type: { type: string, enum: [tugas, activity, timebox] }
        judul: { type: string, minLength: 1 }
        catatan: { type: [string, 'null'] }
        target_date: { $ref: '#/components/schemas/LocalDate' }
        source_entity_type: { type: [string, 'null'], enum: [tugas, activity, timebox_execution, null] }
        source_entity_id: { type: [string, 'null'], format: uuid }
        status: { const: draft }
      dependentRequired:
        source_entity_type: [source_entity_id]
        source_entity_id: [source_entity_type]
      allOf:
        - if: { properties: { source_entity_type: { type: string } }, required: [source_entity_type] }
          then: { properties: { source_entity_id: { $ref: '#/components/schemas/Uuid' } } }
          else: { properties: { source_entity_id: { type: 'null' } } }
    WeeklyPlanDraftUpdate:
      $ref: '#/components/schemas/WeeklyPlanDraftMutation'
    WeeklyWorkloadDay:
      type: object
      additionalProperties: false
      required: [date, task_count, estimated_minutes, unestimated_task_count]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        task_count: { type: integer, minimum: 0 }
        estimated_minutes: { type: integer, minimum: 0 }
        unestimated_task_count: { type: integer, minimum: 0 }
    WeeklyReviewSummaryResult:
      type: object
      additionalProperties: false
      required: [review, is_frozen, summary_cutoff_at, summary, next_week_workload]
      properties:
        review: { $ref: '#/components/schemas/WeeklyReview' }
        is_frozen: { type: boolean }
        summary_cutoff_at: { type: [string, 'null'], format: date-time }
        summary: { $ref: '#/components/schemas/WeeklyProductivitySummary' }
        next_week_workload:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/WeeklyWorkloadDay' }
    WeeklyReviewCandidate:
      type: object
      additionalProperties: false
      required: [source_entity_type, source_entity_id, judul, date, status]
      properties:
        source_entity_type: { type: string, enum: [tugas, activity, timebox_execution] }
        source_entity_id: { $ref: '#/components/schemas/Uuid' }
        judul: { type: string, minLength: 1 }
        date: { $ref: '#/components/schemas/LocalDate' }
        status: { type: string, minLength: 1 }
    WeeklyPlanPromotionTugasCommand:
      type: object
      additionalProperties: false
      required: [target_type, target_id, payload]
      properties:
        target_type: { const: tugas }
        target_id: { $ref: '#/components/schemas/Uuid' }
        payload: { $ref: '#/components/schemas/TugasCreate' }
    WeeklyPlanPromotionActivityCommand:
      type: object
      additionalProperties: false
      required: [target_type, target_id, payload]
      properties:
        target_type: { const: activity }
        target_id: { $ref: '#/components/schemas/Uuid' }
        payload: { $ref: '#/components/schemas/ActivityCreate' }
    WeeklyPlanPromotionTimeboxCommand:
      type: object
      additionalProperties: false
