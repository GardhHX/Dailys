      description: Soft-delete tombstone.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TombstoneEnvelope' }
    BadRequest:
      description: Invalid request syntax or invariant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found or not owned by the authenticated user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Unique conflict, idempotency-key reuse, or invalid state transition.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    SyncGone:
      description: Cursor or snapshot expired, or a full snapshot is required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: Batch exceeds 500 changes or 2 MiB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Transient rate limit; the request is not persisted in ProcessedChange and may be retried unchanged.
      headers:
        Retry-After:
          description: Delay in seconds before retrying, when known.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Transient server failure; the affected item transaction is rolled back and is not persisted in ProcessedChange.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableEntity:
      description: Structurally valid payload violates a business rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Instant:
      type: string
      format: date-time
      examples: ['2026-08-29T12:15:00Z']
    LocalDate:
      type: string
      format: date
      examples: ['2026-08-29']
    LocalTime:
      type: string
      pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
      examples: ['09:30:00']
    ReminderOffsetsMinutes:
      type: array
      default: []
      uniqueItems: true
      items: { type: integer, minimum: 0 }
      description: Minutes before the scheduled start; must be empty when no start time exists.
    TaskCalendarDayReminder:
      type: object
      additionalProperties: false
      required: [kind, days_before, local_time]
      properties:
        kind: { const: calendar_day }
        days_before: { type: integer, minimum: 0, maximum: 365 }
        local_time: { $ref: '#/components/schemas/LocalTime' }
    TaskRelativeMinutesReminder:
      type: object
      additionalProperties: false
      required: [kind, minutes_before]
      properties:
        kind: { const: relative_minutes }
        minutes_before: { type: integer, minimum: 0, maximum: 525600 }
    TaskReminder:
      oneOf:
        - $ref: '#/components/schemas/TaskCalendarDayReminder'
        - $ref: '#/components/schemas/TaskRelativeMinutesReminder'
      discriminator:
        propertyName: kind
        mapping:
          calendar_day: '#/components/schemas/TaskCalendarDayReminder'
          relative_minutes: '#/components/schemas/TaskRelativeMinutesReminder'
    TaskReminders:
      type: array
      uniqueItems: true
      default:
        - { kind: calendar_day, days_before: 7, local_time: '09:00:00' }
        - { kind: calendar_day, days_before: 3, local_time: '09:00:00' }
        - { kind: calendar_day, days_before: 1, local_time: '09:00:00' }
        - { kind: relative_minutes, minutes_before: 120 }
      items: { $ref: '#/components/schemas/TaskReminder' }
    Meta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        next_cursor: { type: [string, 'null'] }
        latest_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    Warning:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code: { const: SCHEDULE_OVERLAP }
        message: { type: string }
        details:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/OverlapWarningDetail' }
    OverlapWarningDetail:
      type: object
      additionalProperties: false
      required: [left_entity_type, left_entity_id, right_entity_type, right_entity_id, overlap_start, overlap_end]
      properties:
        left_entity_type: { type: string, enum: [activity, timebox_execution] }
        left_entity_id: { $ref: '#/components/schemas/Uuid' }
        right_entity_type: { type: string, enum: [activity, timebox_execution] }
        right_entity_id: { $ref: '#/components/schemas/Uuid' }
        overlap_start: { $ref: '#/components/schemas/Instant' }
        overlap_end: { $ref: '#/components/schemas/Instant' }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [path, reason]
      properties:
        path: { type: string }
        reason: { type: string }
    ApiError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - UNAUTHORIZED
          - NOT_FOUND
          - PARENT_NOT_FOUND
          - RESOURCE_IN_USE
          - CONFLICT
          - INVALID_STATE_TRANSITION
          - IDEMPOTENCY_KEY_REUSED
          - CURSOR_EXPIRED
          - SNAPSHOT_REQUIRED
          - SYNC_EPOCH_MISMATCH
          - SNAPSHOT_EXPIRED
          - DEVICE_REVOKED
          - PAYLOAD_TOO_LARGE
          - RATE_LIMITED
          - INTERNAL_ERROR
          - BASE_REVISION_UNAVAILABLE
          - SYNC_GENERATION_MISMATCH
          - WEEKLY_REVIEW_REQUIRED
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    SyncDeterministicError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      description: Durable per-item rejection or recovery requirement; review is a separate typed outcome. Transient
        errors remain HTTP-level.
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - NOT_FOUND
          - PARENT_NOT_FOUND
          - RESOURCE_IN_USE
          - CONFLICT
          - INVALID_STATE_TRANSITION
          - IDEMPOTENCY_KEY_REUSED
          - PAYLOAD_TOO_LARGE
          - BASE_REVISION_UNAVAILABLE
          - WEEKLY_REVIEW_REQUIRED
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    EntityMetadata:
      type: object
      required: [id, created_at, updated_at, is_deleted, deleted_at, server_revision]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        created_at: { $ref: '#/components/schemas/Instant' }
        updated_at: { $ref: '#/components/schemas/Instant' }
        is_deleted: { const: false }
        deleted_at: { type: 'null' }
        server_revision: { type: integer, minimum: 1 }
    UserSettings:
      allOf:
        - $ref: '#/components/schemas/EntityMetadata'
        - type: object
          required: [language, timezone, pomodoro_focus_minutes, pomodoro_short_break_minutes, pomodoro_long_break_minutes, pomodoro_long_break_interval, alarm_mode, notifications_enabled, weekly_review_time]
          properties:
            language: { type: string, enum: [id, en] }
            timezone: { type: string, minLength: 1, description: Valid IANA timezone name used for day boundaries and future materialization; changing it never rewrites stored Local dates or Instants. }
            pomodoro_focus_minutes: { type: integer, minimum: 1, maximum: 180 }
            pomodoro_short_break_minutes: { type: integer, minimum: 1, maximum: 60 }
            pomodoro_long_break_minutes: { type: integer, minimum: 1, maximum: 120 }
            pomodoro_long_break_interval: { type: integer, minimum: 2, maximum: 12 }
            alarm_mode: { type: string, enum: [sound, muted] }
            notifications_enabled: { type: boolean }
            weekly_review_time:
              allOf: [{ $ref: '#/components/schemas/LocalTime' }]
              default: '09:00:00'
              description: Local trigger time; the review day is fixed to Sunday in v1.0.
      unevaluatedProperties: false
    WeeklyActivitySummary:
      type: object
      additionalProperties: false
      required: [planned, completed, skipped, not_started, rate_percent]
      properties:
        planned: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        not_started: { type: integer, minimum: 0 }
        rate_percent: { type: number, minimum: 0, maximum: 100, multipleOf: 0.1 }
    WeeklyTaskSummary:
      type: object
      additionalProperties: false
      required: [completed, active, overdue]
      properties:
        completed: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
    WeeklyPomodoroSummary:
      type: object
      additionalProperties: false
      required: [completed_focus_sessions, focus_seconds]
      properties:
        completed_focus_sessions: { type: integer, minimum: 0 }
        focus_seconds: { type: integer, minimum: 0 }
    WeeklyTimeboxSummary:
      type: object
      additionalProperties: false
      required: [completed, missed, skipped, pending]
      properties:
        completed: { type: integer, minimum: 0 }
        missed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
    WeeklyHabitSummary:
      type: object
      additionalProperties: false
      required: [done, missed, excused]
      properties:
        done: { type: integer, minimum: 0 }
        missed: { type: integer, minimum: 0 }
        excused: { type: integer, minimum: 0 }
    WeeklyProductivitySummary:
      type: object
      additionalProperties: false
      required: [week_start, week_end, activity, tugas, pomodoro, timebox, habit]
      properties:
        week_start: { $ref: '#/components/schemas/LocalDate' }
        week_end: { $ref: '#/components/schemas/LocalDate' }
        activity: { $ref: '#/components/schemas/WeeklyActivitySummary' }
        tugas: { $ref: '#/components/schemas/WeeklyTaskSummary' }
        pomodoro: { $ref: '#/components/schemas/WeeklyPomodoroSummary' }
        timebox: { $ref: '#/components/schemas/WeeklyTimeboxSummary' }
        habit: { $ref: '#/components/schemas/WeeklyHabitSummary' }
    WeeklySummarySnapshot:
      type: object
      additionalProperties: false
      required: [week_start, week_end, cutoff_at, activity, tugas, pomodoro, timebox, habit]
      properties:
        week_start: { $ref: '#/components/schemas/LocalDate' }
        week_end: { $ref: '#/components/schemas/LocalDate' }
        cutoff_at: { $ref: '#/components/schemas/Instant' }
        activity: { $ref: '#/components/schemas/WeeklyActivitySummary' }
        tugas: { $ref: '#/components/schemas/WeeklyTaskSummary' }
        pomodoro: { $ref: '#/components/schemas/WeeklyPomodoroSummary' }
        timebox: { $ref: '#/components/schemas/WeeklyTimeboxSummary' }
        habit: { $ref: '#/components/schemas/WeeklyHabitSummary' }
    WeeklyReview:
      allOf:
        - $ref: '#/components/schemas/EntityMetadata'
        - type: object
          required: [week_start, week_end, status, evaluation_text, next_week_focus_text, summary_snapshot, summary_cutoff_at, completed_at]
          properties:
            week_start: { $ref: '#/components/schemas/LocalDate' }
            week_end: { $ref: '#/components/schemas/LocalDate' }
            status: { type: string, enum: [draft, completed] }
            evaluation_text: { type: string }
            next_week_focus_text: { type: string }
            summary_snapshot:
              oneOf:
                - { $ref: '#/components/schemas/WeeklySummarySnapshot' }
                - { type: 'null' }
            summary_cutoff_at: { type: [string, 'null'], format: date-time }
            completed_at: { type: [string, 'null'], format: date-time }
        - if:
            properties: { status: { const: completed } }
            required: [status]
          then:
            properties:
              evaluation_text: { type: string, minLength: 1 }
              next_week_focus_text: { type: string, minLength: 1 }
              summary_snapshot: { $ref: '#/components/schemas/WeeklySummarySnapshot' }
              summary_cutoff_at: { $ref: '#/components/schemas/Instant' }
              completed_at: { $ref: '#/components/schemas/Instant' }
          else:
            properties:
              summary_snapshot: { type: 'null' }
              summary_cutoff_at: { type: 'null' }
              completed_at: { type: 'null' }
      unevaluatedProperties: false
    WeeklyPlanDraft:
      allOf:
        - $ref: '#/components/schemas/EntityMetadata'
        - type: object
          required: [weekly_review_id, target_type, judul, catatan, target_date, source_entity_type, source_entity_id, status, promoted_entity_type, promoted_entity_id]
          properties:
            weekly_review_id: { $ref: '#/components/schemas/Uuid' }
            target_type: { type: string, enum: [tugas, activity, timebox] }
            judul: { type: string, minLength: 1 }
            catatan: { type: [string, 'null'] }
            target_date: { $ref: '#/components/schemas/LocalDate' }
            source_entity_type: { type: [string, 'null'], enum: [tugas, activity, timebox_execution, null] }
            source_entity_id: { type: [string, 'null'], format: uuid }
            status: { type: string, enum: [draft, promoted, discarded] }
            promoted_entity_type: { type: [string, 'null'], enum: [tugas, activity, timebox, null] }
