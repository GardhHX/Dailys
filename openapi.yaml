    SyncConflictReview:
      type: object
      additionalProperties: false
      required:
      - base_record
      - local_payload
      - server_record
      - reviewed_server_revision
      - operation
      - conflicting_groups
      - reason
      properties:
        base_record:
          $ref: '#/components/schemas/SyncEntityRecord'
        local_payload:
          oneOf:
          - $ref: '#/components/schemas/SyncEntityUpsertPayload'
          - type: 'null'
        server_record:
          $ref: '#/components/schemas/SyncEntityRecord'
        reviewed_server_revision:
          type: integer
          minimum: 1
        operation:
          type: string
          enum:
          - upsert
          - delete
          - restore
        conflicting_groups:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        reason:
          type: string
          enum:
          - field_conflict
          - merged_invariant
          - stale_delete
          - server_changed
      description: No domain write. Groups follow schema.md 18.1; domain validation couples IDs/revision to outer entity
        and server record. Missing base requires recovery.
      allOf:
      - if:
          properties:
            operation:
              const: upsert
          required:
          - operation
        then:
          properties:
            local_payload:
              $ref: '#/components/schemas/SyncEntityUpsertPayload'
      - if:
          properties:
            operation:
              enum:
              - delete
              - restore
          required:
          - operation
        then:
          properties:
            local_payload:
              type: 'null'
