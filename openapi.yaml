          type: boolean
          description: True only for review_required; safe merge uses merge_applied.
        accepted_record:
          oneOf:
          - $ref: '#/components/schemas/SyncEntityRecord'
          - type: 'null'
        replaced_record:
          oneOf:
          - $ref: '#/components/schemas/SyncEntityRecord'
          - type: 'null'
