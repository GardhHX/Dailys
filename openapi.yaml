    TransferMutation:
      type: object
      additionalProperties: false
      required: [akun_asal_id, akun_tujuan_id, jumlah, tanggal]
      properties:
        akun_asal_id: { $ref: '#/components/schemas/Uuid' }
        akun_tujuan_id: { $ref: '#/components/schemas/Uuid' }
        jumlah: { type: integer, minimum: 1, description: Integer Rupiah. }
        tanggal: { $ref: '#/components/schemas/LocalDate' }
        catatan: { type: [string, 'null'] }
    BalanceCorrectionCommand:
      type: object
      additionalProperties: false
      required: [target_balance, tanggal]
      properties:
        target_balance: { type: integer, description: Desired ledger-derived account balance in integer Rupiah. }
        tanggal: { $ref: '#/components/schemas/LocalDate' }
        catatan: { type: [string, 'null'], description: Human-readable reason for the correction. }
    UserSettingsMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        language: { type: string, enum: [id, en] }
        timezone: { type: string, minLength: 1, description: Must resolve in the server IANA timezone database. }
        pomodoro_focus_minutes: { type: integer, minimum: 1, maximum: 180 }
        pomodoro_short_break_minutes: { type: integer, minimum: 1, maximum: 60 }
        pomodoro_long_break_minutes: { type: integer, minimum: 1, maximum: 120 }
        pomodoro_long_break_interval: { type: integer, minimum: 2, maximum: 12 }
        alarm_mode: { type: string, enum: [sound, muted] }
        notifications_enabled: { type: boolean }
        weekly_review_time:
          allOf: [{ $ref: '#/components/schemas/LocalTime' }]
          default: '09:00:00'
