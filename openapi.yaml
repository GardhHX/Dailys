openapi: 3.1.0
info:
  title: Dailys API
  version: 1.0.0
  description: Unimplemented target v1.0 contract. Windows first, Android at M2. Sync uses canonical three-way merge, explicit conflict review and user-approved recovery.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: example.invalid
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Sync
  - name: MataKuliah
  - name: Tugas
  - name: Activity
  - name: Pomodoro
  - name: Timebox
  - name: Habit
  - name: Finance
  - name: Settings
  - name: WeeklyReview

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service and database health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'

  /sync/devices:
    post:
      tags: [Sync]
      operationId: registerSyncDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncDeviceRegistration'
      responses:
        '200':
          description: Existing device registration returned idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncDeviceEnvelope' }
        '201':
          description: Device registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncDeviceEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sync/push:
    post:
      tags:
      - Sync
      operationId: pushChanges
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Per-item sync results. Invalid items do not roll back accepted items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/SyncGone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    parameters:
    - $ref: '#/components/parameters/SyncGeneration'

  /sync/pull:
    get:
      tags:
      - Sync
      operationId: pullChanges
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/SyncEpoch'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ordered changes after the supplied opaque cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '410':
          $ref: '#/components/responses/SyncGone'
    parameters:
    - $ref: '#/components/parameters/SyncGeneration'

  /sync/ack:
    post:
      tags:
      - Sync
      operationId: acknowledgeSyncRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncAckRequest'
      responses:
        '200':
          description: Monotonic acknowledgement accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncAckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    parameters:
    - $ref: '#/components/parameters/SyncGeneration'

  /sync/snapshot/start:
    post:
      tags:
      - Sync
      operationId: startSyncSnapshot
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncSnapshotStartRequest'
      responses:
        '200':
          description: Existing snapshot session returned for an idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSnapshotStartEnvelope'
        '201':
          description: Frozen snapshot session created with a new sync epoch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSnapshotStartEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    parameters:
    - $ref: '#/components/parameters/SyncGeneration'

  /sync/snapshot/{snapshotId}:
    parameters:
    - $ref: '#/components/parameters/SnapshotId'
    - $ref: '#/components/parameters/SyncGeneration'
    get:
      tags:
      - Sync
      operationId: getSyncSnapshotPage
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/SnapshotLimit'
      responses:
        '200':
          description: Stable page from the frozen snapshot records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSnapshotPageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/SyncGone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '409':
          $ref: '#/components/responses/Conflict'

  /sync/snapshot/{snapshotId}/complete:
    parameters:
    - $ref: '#/components/parameters/SnapshotId'
    - $ref: '#/components/parameters/SyncGeneration'
    post:
      tags:
      - Sync
      operationId: completeSyncSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncSnapshotCompleteRequest'
      responses:
        '200':
          description: Snapshot completed; device is active at the high watermark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncDeviceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/SyncGone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /settings:
    get:
      tags: [Settings]
      operationId: getUserSettings
      responses:
        '200': { $ref: '#/components/responses/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Settings]
      operationId: updateUserSettings
      description: Partial update with a full response. A timezone change leaves stored Local dates and Instants intact, recomputes day-boundary projections, reschedules existing notifications for the same trigger Instant, and applies to occurrences created after each materialization watermark. Pomodoro duration changes apply to the next phase/session. Disabling notifications cancels pending local triggers and preserves domain reminder offsets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettingsMutation' }
      responses:
        '200': { $ref: '#/components/responses/UserSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /weekly-reviews:
    get:
      tags: [WeeklyReview]
      operationId: getWeeklyReview
      parameters:
        - name: week_start
          in: query
          required: true
          description: Monday local date for the reviewed week.
          schema: { $ref: '#/components/schemas/LocalDate' }
      responses:
        '200': { $ref: '#/components/responses/WeeklyReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [WeeklyReview]
      operationId: createWeeklyReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyReviewCreate' }
      responses:
        '200': { $ref: '#/components/responses/WeeklyReview' }
        '201': { $ref: '#/components/responses/WeeklyReviewCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /weekly-reviews/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [WeeklyReview]
      operationId: updateWeeklyReview
      description: Updates reflection text on draft or completed reviews. Frozen fields cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyReviewUpdate' }
      responses:
        '200': { $ref: '#/components/responses/WeeklyReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /weekly-reviews/{id}/summary:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [WeeklyReview]
      operationId: getWeeklyReviewSummary
      description: Returns a live summary for a draft or the frozen snapshot for a completed review.
      responses:
        '200': { $ref: '#/components/responses/WeeklyReviewSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /weekly-reviews/{id}/candidates:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [WeeklyReview]
      operationId: listWeeklyReviewCandidates
      description: Read-only unfinished work from the reviewed week; no source record is moved or mutated.
      responses:
        '200': { $ref: '#/components/responses/WeeklyReviewCandidates' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /weekly-reviews/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [WeeklyReview]
      operationId: completeWeeklyReview
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyReviewCompleteCommand' }
      responses:
        '200': { $ref: '#/components/responses/WeeklyReviewSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /weekly-reviews/{id}/drafts:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [WeeklyReview]
      operationId: listWeeklyPlanDrafts
      responses:
        '200': { $ref: '#/components/responses/WeeklyPlanDraftList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [WeeklyReview]
      operationId: createWeeklyPlanDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyPlanDraftCreate' }
      responses:
        '201': { $ref: '#/components/responses/WeeklyPlanDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /weekly-reviews/{id}/drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: draftId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    put:
      tags: [WeeklyReview]
      operationId: updateWeeklyPlanDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyPlanDraftUpdate' }
      responses:
        '200': { $ref: '#/components/responses/WeeklyPlanDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [WeeklyReview]
      operationId: deleteWeeklyPlanDraft
      responses:
        '200': { $ref: '#/components/responses/Tombstone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /weekly-reviews/{id}/drafts/{draftId}/promote:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: draftId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [WeeklyReview]
      operationId: promoteWeeklyPlanDraft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyPlanPromotionCommand' }
      responses:
        '200': { $ref: '#/components/responses/WeeklyPlanPromotion' }
        '201': { $ref: '#/components/responses/WeeklyPlanPromotion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /matakuliah:
    get:
      tags: [MataKuliah]
      operationId: listMataKuliah
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/MataKuliahList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [MataKuliah]
      operationId: createMataKuliah
      requestBody:
        $ref: '#/components/requestBodies/MataKuliahCreate'
      responses:
        '201': { $ref: '#/components/responses/MataKuliahCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /matakuliah/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [MataKuliah]
      operationId: updateMataKuliah
      requestBody:
        $ref: '#/components/requestBodies/MataKuliahUpdate'
      responses:
        '200': { $ref: '#/components/responses/MataKuliah' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [MataKuliah]
      operationId: deleteMataKuliah
      description: Atomically tombstones CourseNotes, detaches Tasks, then tombstones the course.
      responses:
        '200': { $ref: '#/components/responses/Tombstone' }
        '404': { $ref: '#/components/responses/NotFound' }

  /matakuliah/{mataKuliahId}/catatan:
    parameters:
      - $ref: '#/components/parameters/MataKuliahId'
    get:
      summary: List course notes
      tags: [MataKuliah]
      operationId: listCourseNotes
      parameters:
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/CourseNoteList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a course note
      tags: [MataKuliah]
      operationId: createCourseNote
      requestBody:
        $ref: '#/components/requestBodies/CourseNoteCreate'
      responses:
        '201': { $ref: '#/components/responses/CourseNoteCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /matakuliah/{mataKuliahId}/catatan/{id}:
    parameters:
      - $ref: '#/components/parameters/MataKuliahId'
      - $ref: '#/components/parameters/Id'
    put:
      summary: Update a course note
      tags: [MataKuliah]
      operationId: updateCourseNote
      requestBody:
        $ref: '#/components/requestBodies/CourseNoteUpdate'
      responses:
        '200': { $ref: '#/components/responses/CourseNote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Soft-delete a course note
      tags: [MataKuliah]
      operationId: deleteCourseNote
      responses:
        '200': { $ref: '#/components/responses/Tombstone' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tugas:
    get:
      tags: [Tugas]
      operationId: listTugas
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [belum, progress, selesai] } }
        - { name: mata_kuliah_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: prioritas, in: query, schema: { type: string, enum: [low, medium, high] } }
        - { name: sort, in: query, schema: { type: string, enum: [deadline, prioritas, mata_kuliah] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/TugasCardList' }
    post:
      tags: [Tugas]
      operationId: createTugas
      requestBody:
        $ref: '#/components/requestBodies/TugasCreate'
      responses:
        '201': { $ref: '#/components/responses/TugasCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /tugas/riwayat:
    get:
      summary: List task history by day
      tags: [Tugas]
      operationId: listTugasHistory
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200': { $ref: '#/components/responses/TugasHistoryList' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /tugas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tugas]
      operationId: getTugas
      responses:
        '200': { $ref: '#/components/responses/Tugas' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tugas]
      operationId: updateTugas
      requestBody:
        $ref: '#/components/requestBodies/TugasUpdate'
      responses:
        '200': { $ref: '#/components/responses/Tugas' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Tugas]
      operationId: deleteTugas
      description: Atomically tombstones checklist items, preserves historical session references, then tombstones the task.
      responses:
        '200': { $ref: '#/components/responses/Tombstone' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tugas/{id}/archive:
    put:
      tags: [Tugas]
      operationId: setTugasArchived
      description: Archives or unarchives a task manually. Overdue unfinished tasks remain active unless archived by this command.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TugasArchiveCommand' }
      responses:
        '200': { $ref: '#/components/responses/Tugas' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tugas/{tugasId}/checklist:
    parameters:
      - $ref: '#/components/parameters/TugasId'
    get:
      tags: [Tugas]
      operationId: listTugasChecklist
      responses:
        '200': { $ref: '#/components/responses/TugasChecklistList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Tugas]
      operationId: createTugasChecklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistCreate'
      responses:
        '201': { $ref: '#/components/responses/TugasChecklistCreated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tugas/{tugasId}/checklist/{id}:
    parameters:
      - $ref: '#/components/parameters/TugasId'
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Tugas]
      operationId: updateTugasChecklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistMutation'
      responses:
        '200': { $ref: '#/components/responses/TugasChecklist' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tugas]
      operationId: deleteTugasChecklist
      responses:
        '200': { $ref: '#/components/responses/Tombstone' }
        '404': { $ref: '#/components/responses/NotFound' }

  /activity-categories:
    get:
      tags: [Activity]
      operationId: listActivityCategories
      parameters:
        - { name: is_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { $ref: '#/components/responses/ActivityCategoryList' }
    post:
      tags: [Activity]
      operationId: createActivityCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityCategoryCreate' }
      responses:
        '201': { $ref: '#/components/responses/ActivityCategoryCreated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /activity-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Activity]
      operationId: updateActivityCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityCategoryMutation' }
      responses:
        '200': { $ref: '#/components/responses/ActivityCategory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Activity]
      operationId: deleteActivityCategory
      description: Deletes an unused custom category. Referenced or system categories must be archived instead.
      responses:
        '200': { $ref: '#/components/responses/Tombstone' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /activity:
    get:
      tags: [Activity]
      operationId: listActivities
      parameters:
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - { name: activity_category_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ActivityList' }
    post:
      tags: [Activity]
      operationId: createActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreate'
      responses:
        '201': { $ref: '#/components/responses/ActivityCreated' }
