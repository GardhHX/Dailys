      - payload
      - resolution_of
      properties:
        change_id:
          $ref: '#/components/schemas/Uuid'
        entity_type:
          $ref: '#/components/schemas/SyncEntityType'
        entity_id:
          $ref: '#/components/schemas/Uuid'
