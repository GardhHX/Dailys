  /akun:
    get:
      tags: [Finance]
      operationId: listAccounts
      parameters:
        - { name: is_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { $ref: '#/components/responses/AccountList' }
    post:
      tags: [Finance]
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201': { $ref: '#/components/responses/AccountCreated' }

  /akun/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Finance]
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200': { $ref: '#/components/responses/Account' }
    delete:
      tags: [Finance]
      operationId: deleteAccount
      description: Returns 409 RESOURCE_IN_USE if any retained transaction references this account.
      responses:
        '200': { $ref: '#/components/responses/Tombstone' }
        '409': { $ref: '#/components/responses/Conflict' }

  /akun/{id}/koreksi-saldo:
    post:
      tags: [Finance]
      operationId: correctAccountBalance
      description: Creates an adjustment transaction for the difference between the current and target balance. A zero difference returns the account without a transaction.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BalanceCorrectionCommand' }
      responses:
        '200': { $ref: '#/components/responses/BalanceCorrection' }
        '201': { $ref: '#/components/responses/BalanceCorrection' }
        '404': { $ref: '#/components/responses/NotFound' }

  /category-keuangan:
    get:
      tags: [Finance]
      operationId: listFinanceCategories
      parameters:
        - { name: is_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { $ref: '#/components/responses/FinanceCategoryList' }
    post:
      tags: [Finance]
      operationId: createFinanceCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceCategoryCreate'
      responses:
        '201': { $ref: '#/components/responses/FinanceCategoryCreated' }

  /category-keuangan/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Finance]
      operationId: updateFinanceCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceCategoryMutation'
      responses:
        '200': { $ref: '#/components/responses/FinanceCategory' }
    delete:
      tags: [Finance]
      operationId: deleteFinanceCategory
      description: Returns 409 RESOURCE_IN_USE if any retained transaction references this category.
      responses:
        '200': { $ref: '#/components/responses/Tombstone' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transaksi:
    get:
      tags: [Finance]
      operationId: listTransactions
      parameters:
        - { name: akun_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: category_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: tipe, in: query, schema: { type: string, enum: [income, expense, transfer, adjustment] } }
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/TransactionList' }
    post:
      tags: [Finance]
      operationId: createTransaction
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '201': { $ref: '#/components/responses/TransactionCreated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transaksi/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Finance]
      operationId: updateTransaction
      description: Updates income or expense only; transfer must use /transaksi/transfer/{id}, while adjustment is immutable.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionMutation'
      responses:
        '200': { $ref: '#/components/responses/Transaction' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Finance]
      operationId: deleteTransaction
      description: Reverses and tombstones income, expense, or transfer atomically. Adjustment is immutable and returns 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Transaction' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transaksi/transfer:
    post:
      tags: [Finance]
      operationId: createTransfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferMutation'
      responses:
        '201': { $ref: '#/components/responses/TransactionCreated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transaksi/transfer/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Finance]
      operationId: updateTransfer
      description: Reverses the previous two-account ledger effect and applies the replacement atomically.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferMutation'
      responses:
        '200': { $ref: '#/components/responses/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transaksi/summary:
    get:
      tags: [Finance]
      operationId: getFinanceSummary
      description: Current total balance across non-archived accounts plus income and expense totals for the inclusive requested local-date period. Dates must be supplied together and default to the current local calendar month. Transfer and adjustment transactions never count as income or expense.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200': { $ref: '#/components/responses/FinanceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /transaksi/chart/kategori:
    get:
      tags: [Finance]
      operationId: getFinanceCategoryChart
      description: Sums active expense transactions by category over the inclusive local-date period; dates must be supplied together and default to the current local calendar month. Transfers and zero-total categories are omitted. Results are ordered by amount descending, then category_id.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200': { $ref: '#/components/responses/FinanceCategoryChart' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /transaksi/chart/trend:
    get:
      tags: [Finance]
      operationId: getFinanceTrendChart
      description: Sums active income and expense transactions by calendar month over the inclusive local-date period; dates must be supplied together and default to the last 12 calendar months including the current month. Transfers are excluded. Every intersecting month is returned, including zero months, ordered ascending.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200': { $ref: '#/components/responses/FinanceTrendChart' }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API-Key

  headers:
    Deprecation:
      description: RFC 9745 Structured Field Date for 2026-09-04T00:00:00Z.
      schema: { type: string, const: '@1788480000' }
    RemovalVersion:
      description: API version that removes this operation.
      schema: { type: string, const: '2.0.0' }
    ReplacementLink:
      description: RFC 8288 successor-version link to the canonical replacement using the actual resource ID.
      schema:
        type: string
        example: '</api/v1/timebox/11111111-1111-4111-8111-111111111111/executions>; rel="successor-version"'

  parameters:
    SyncGeneration:
      name: X-Sync-Generation
      in: header
      required: true
      description: Active restore generation from registration. Checked before replay cache and epoch; mismatch returns
        409 SYNC_GENERATION_MISMATCH.
      schema:
        $ref: '#/components/schemas/Uuid'
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TugasId:
      name: tugasId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MataKuliahId:
      name: mataKuliahId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    LogId:
      name: logId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Lowercase canonical UUID. Reuse is valid only with the byte-equivalent logical request body; snapshot-start replay lookup occurs before epoch validation.
      schema: { $ref: '#/components/schemas/Uuid' }
    DeviceId:
      name: device_id
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SyncEpoch:
      name: sync_epoch
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    SnapshotLimit:
      name: limit
      in: query
      required: false
      description: Requested item cap; response may contain fewer records to stay under 2 MiB.
      schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
    Date:
      name: date
      in: query
      required: false
      description: Local date; endpoint-specific defaults apply when omitted.
      schema: { $ref: '#/components/schemas/LocalDate' }
    StartDate:
      name: start_date
      in: query
      required: false
      description: Inclusive local-date start; endpoints that accept an optional range require start_date and end_date together.
      schema: { $ref: '#/components/schemas/LocalDate' }
    EndDate:
      name: end_date
      in: query
      required: false
      description: Inclusive local-date end; endpoints that accept an optional range require start_date and end_date together.
      schema: { $ref: '#/components/schemas/LocalDate' }

