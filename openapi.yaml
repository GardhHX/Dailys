          type:
          - integer
          - 'null'
          minimum: 1
        client_updated_at:
          $ref: '#/components/schemas/Instant'
        payload:
          oneOf:
          - $ref: '#/components/schemas/SyncEntityUpsertPayload'
          - type: 'null'
          description: Complete mutable local candidate for canonical three-way merge; null for delete/restore.
        resolution_of:
          type:
          - string
          - 'null'
          format: uuid
          description: Prior review change_id in same user/device/generation, or null for ordinary mutation.
      allOf:
      - if:
          properties:
            operation:
              const: upsert
          required:
          - operation
        then:
          properties:
            payload:
              $ref: '#/components/schemas/SyncEntityUpsertPayload'
      - if:
          properties:
            operation:
              enum:
              - delete
              - restore
          required:
          - operation
        then:
          required:
          - base_server_revision
          properties:
            base_server_revision:
              type: integer
              minimum: 1
            payload:
              type: 'null'
      - $ref: '#/components/schemas/SyncPayloadByEntityType'
      - if:
          properties:
            resolution_of:
