        category_id: { $ref: '#/components/schemas/Uuid' }
        tipe: { type: string, enum: [income, expense] }
        jumlah: { type: integer, minimum: 1, description: Integer Rupiah. }
        tanggal: { $ref: '#/components/schemas/LocalDate' }
        catatan: { type: [string, 'null'] }
    TransactionCreate:
      allOf:
        - $ref: '#/components/schemas/TransactionMutation'
