      x-removal-version: 2.0.0
      x-replacement-operation-id: createTimeboxExecution
      tags: [Timebox]
      operationId: markTimeboxStatusCompatibility
      description: Compatibility route deprecated in v1.0.0 and removed in v2.0.0. Use POST /timebox/{id}/executions through operation createTimeboxExecution.
      parameters:
