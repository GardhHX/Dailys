<div id="dailys-review">
  <header class="dr-top"><strong class="dr-brand">dailys.</strong><div class="dr-topright"><span class="dr-small dr-muted">Preview · data contoh</span><button type="button" id="dr-theme" aria-label="Ganti tema">Tema: sistem</button></div></header>
  <div class="dr-demo"><label for="dr-scenario">Keadaan contoh<select id="dr-scenario"><option value="gate">Review wajib · Minggu 10.20</option><option value="before">Dibuka manual · Minggu 08.30</option><option value="completed">Review selesai</option><option value="empty">Minggu tanpa aktivitas</option><option value="fresh">Instalasi pertama · Rabu</option></select></label><span class="dr-muted">State sementara · offline</span></div>
  <main id="dr-content"></main>
  <div id="dr-notice" class="dr-notice" role="status" aria-live="polite"></div>
  <dialog id="dr-dialog" aria-labelledby="dr-modal-title"><div class="dr-modalhead"><h2 id="dr-modal-title"></h2><button type="button" id="dr-close" aria-label="Tutup dialog">Tutup</button></div><div id="dr-modal-content"></div></dialog>
</div>
<script>
(() => {
  const root=document.getElementById('dailys-review'),q=s=>root.querySelector(s);
  const design={screen:'review',theme:'otomatis',condition:'terisi',scenario:'gate'};
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone=v=>JSON.parse(JSON.stringify(v)),labels={tugas:'Tugas',activity:'Activity',timebox:'Timebox'};
  const dates=['2026-09-14','2026-09-15','2026-09-16','2026-09-17','2026-09-18','2026-09-19','2026-09-20'],days=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
  const dateLabel=d=>dates.includes(d)?days[dates.indexOf(d)]+', '+Number(d.slice(-2))+' Sep':d;
  const seedSummary={activity:{planned:37,completed:33,skipped:1,not_started:3},tugas:{completed:4,active:3,overdue:1},pomodoro:{completed_sessions:9,focus_seconds:13500},timebox:{completed:6,missed:1,skipped:1,pending:2},habit:{done:16,missed:3,excused:2}};
  let sourceSummary=clone(seedSummary),review,drafts,candidates,targets,sequence=3,unsaved=false,lastScenario='',lastCondition='',returnFocus=null,pendingPromotion=null;
  const receipts=new Map(),dialog=q('#dr-dialog');
  function reset(){
    review={status:'draft',evaluation_text:'',next_week_focus_text:'',summary_snapshot:null,summary_cutoff_at:null,completed_at:null};
    drafts=[{id:'p1',target_type:'tugas',judul:'Latihan query transaksi',catatan:'Kerjakan lima query sebelum praktikum.',target_date:dates[2],status:'draft'},{id:'p2',target_type:'timebox',judul:'Baca materi jaringan',catatan:'Satu blok belajar sebelum kuliah.',target_date:dates[0],status:'draft'}];
    candidates=[{id:'c1',source_entity_type:'tugas',title:'Laporan basis data',date:'Sabtu, 12 Sep · 18.00',status:'Overdue',target_type:'tugas',module:'Tugas'},{id:'c2',source_entity_type:'activity',title:'Baca materi jaringan',date:'Jumat, 11 Sep',status:'Belum mulai',target_type:'activity',module:'Home'},{id:'c3',source_entity_type:'timebox_execution',title:'Latihan normalisasi',date:'Sabtu, 12 Sep · 15.00',status:'Missed',target_type:'timebox',module:'Home'}];
    targets=[{id:'t1',target_type:'tugas',target_date:dates[0],estimated_minutes:45},{id:'t2',target_type:'tugas',target_date:dates[2],estimated_minutes:null},{id:'t3',target_type:'tugas',target_date:dates[4],estimated_minutes:60}];
    sourceSummary=clone(seedSummary);receipts.clear();unsaved=false;sequence=3;pendingPromotion=null;q('#dr-notice').textContent='';
    if(design.scenario==='empty'){drafts=[];candidates=[];targets=[];sourceSummary=zeroSummary()}
    if(design.scenario==='completed'){
      review.evaluation_text='Blok fokus pagi membantu menyelesaikan laporan. Dua jadwal sore terlewat karena praktikum bergeser.';
      review.next_week_focus_text='Selesaikan latihan query pada Rabu. Siapkan materi jaringan dalam satu blok Senin pagi.';
      finishReview();
    }
  }
  function zeroSummary(){const v=clone(seedSummary);Object.values(v).forEach(g=>Object.keys(g).forEach(k=>g[k]=0));return v}
  const empty=()=>design.condition==='kosong'||design.scenario==='empty';
  const gate=()=>review.status!=='completed'&&design.scenario!=='before'&&design.scenario!=='fresh';
  const now=()=>design.scenario==='before'?'2026-09-13T08:30:00+07:00':'2026-09-13T10:20:00+07:00';
  function summary(){const s=review.status==='completed'?clone(review.summary_snapshot):design.condition==='kosong'?zeroSummary():clone(sourceSummary);s.activity.completion_rate=s.activity.planned?s.activity.completed/s.activity.planned:0;return s}
  function workload(){return dates.map((date,i)=>{const ts=design.condition==='kosong'?[]:targets.filter(t=>t.target_type==='tugas'&&t.target_date===date);return{date,day:days[i],task_count:ts.length,estimated_minutes:ts.reduce((n,t)=>n+(t.estimated_minutes??0),0),unestimated_count:ts.filter(t=>t.estimated_minutes===null).length}})}
  function finishReview(){if(review.status==='completed')return;const snapshot=summary();review={...review,status:'completed',summary_snapshot:clone(snapshot),summary_cutoff_at:now(),completed_at:now()};unsaved=false}
  function say(text,error=false){q('#dr-notice').textContent=text;q('#dr-notice').style.color=error?'var(--dr-red)':'var(--dr-green)'}
  function modal(title,body){returnFocus=document.activeElement;q('#dr-modal-title').textContent=title;q('#dr-modal-content').innerHTML=body;if(!dialog.open)dialog.showModal();const input=dialog.querySelector('input,textarea,select');if(input)input.focus()}
  function close(){dialog.close();if(returnFocus?.isConnected)returnFocus.focus()}
  q('#dr-close').onclick=close;dialog.addEventListener('cancel',e=>{e.preventDefault();close()});
  const foot=(text='Simpan draft')=>`<div class="dr-modalfoot"><button type="button" data-close>Batal</button><button type="submit" class="dr-primary">${text}</button></div>`;
  function state(what){if(design.condition==='memuat')return`<div class="dr-state" role="status"><h3>Membaca ${what}</h3><p>Jurnal dan draft tetap tersedia di perangkat ini.</p></div>`;if(design.condition==='gagal')return`<div class="dr-state" role="alert"><h3>${what[0].toUpperCase()+what.slice(1)} belum dapat dibaca</h3><p>Teks jurnal dan draft tidak dihapus.</p><button type="button" class="dr-outline" data-retry>Coba lagi</button></div>`;return''}
  function render(){
    if(lastScenario!==design.scenario){lastScenario=design.scenario;reset()}
    if(lastCondition!==design.condition){lastCondition=design.condition;if(!dialog.open)pendingPromotion=null}
    root.style.colorScheme=design.theme==='gelap'?'dark':design.theme==='terang'?'light':'light dark';
    q('#dr-theme').textContent='Tema: '+({gelap:'gelap',terang:'terang',otomatis:'sistem'}[design.theme]||'sistem');q('#dr-scenario').value=design.scenario;
    if(design.scenario==='fresh'){
      q('#dr-content').innerHTML=`<button type="button" class="dr-link dr-back" data-home>‹ Home</button><div class="dr-head"><div><h1>Weekly Review</h1><p>Evaluasi satu minggu, lalu siapkan minggu berikutnya.</p></div></div><section class="dr-state"><h2>Review pertama pada Minggu</h2><p>Rabu, 16 September · instalasi pertama. Review wajib pertama dimulai Minggu, 20 September pukul 09.00 WIB. Tidak ada review parsial untuk diisi sekarang.</p><button type="button" class="dr-primary" data-home>Kembali ke Home</button></section>`;return;
    }
    const completed=review.status==='completed',s=summary(),active=drafts.filter(d=>d.status==='draft'),cs=empty()?[]:candidates,completedTime=review.completed_at?.slice(11,16).replace(':','.');
    const banner=completed?`<strong class="dr-success">Review selesai. Planning minggu depan tersedia.</strong><p>Tersimpan lokal · offline. Dua jurnal masih dapat diedit; ringkasan tetap memakai cutoff saat selesai.</p>`:gate()?`<strong>Planning 14–20 September menunggu review ini</strong><p>Siapkan draft di bawah, lalu isi dua jurnal dan selesaikan review. Jadwal yang sudah ada serta pencatatan hasil tetap tersedia.</p>`:`<strong>Planning minggu depan belum ditahan</strong><p>Review dibuka manual sebelum Minggu pukul 09.00 WIB. Ringkasan masih mengikuti data hingga waktu baca.</p>`;

  function validateReview(){let valid=true,first=null;for(const [id,key,text]of [['dr-evaluation','evaluation_text','Isi evaluasi minggu ini.'],['dr-focus','next_week_focus_text','Isi fokus minggu depan.']])if(!review[key].trim()){q('#'+id+'-error').textContent=text;q('#'+id).setAttribute('aria-invalid','true');first??=q('#'+id);valid=false}const invalid=drafts.find(d=>d.status==='draft'&&(!labels[d.target_type]||!dates.includes(d.target_date)||!d.judul.trim()));q('#dr-complete-error').textContent=invalid?'Perbaiki target, judul, atau tanggal draft aktif sebelum menyelesaikan review.':'';if(invalid)valid=false;if(first)first.focus();return valid}

r="dr-targettitle">Judul ${labels[type]}</label><input id="dr-targettitle" name="judul" value="${esc(d.judul)}" required></div><div class="dr-field"><label for="dr-targetdate">${type==='tugas'?'Tanggal deadline':'Tanggal jadwal'}</label><input id="dr-targetdate" name="target_date" type="date" value="${d.target_date}" min="${dates[0]}" max="${dates[6]}" required></div>${details}<div class="dr-field"><label for="dr-targetnote">${type==='tugas'?'Deskripsi':'Catatan'} · opsional</label><textarea id="dr-targetnote" name="catatan" rows="3">${esc(d.catatan)}</textarea></div><p class="dr-small dr-muted">Menyimpan membuat satu target baru dan menandai draft diaktifkan. Sumber kandidat tetap ada.</p><p id="dr-formerror" class="dr-error" role="alert"></p>${foot('Simpan & aktifkan')}</form>`)}
  function promote(id,payload,key){if(receipts.has(key))return receipts.get(key);const d=drafts.find(v=>v.id===id);if(!d||d.status!=='draft')throw Error('Draft sudah diaktifkan atau tidak tersedia.');if(gate())throw Error('Selesaikan review sebelum mengaktifkan rencana minggu depan.');const target={...payload,id:'example-target-'+id+'-'+d.target_type,target_type:d.target_type};targets.push(target);if(d.target_type==='tugas')sourceSummary.tugas.active++;d.status='promoted';d.promoted_entity_type=d.target_type;d.promoted_entity_id=target.id;receipts.set(key,target);return target}
  function moduleInfo(module,title,c=null){modal(title,`<div class="dr-modalbody"><p>Tujuan: ${module}. Sumber tetap pada modul asal dan tidak diubah oleh review ini.</p>${c?`<div class="dr-detail"><dl><dt>Status sumber</dt><dd>${esc(c.status)}</dd><dt>Tanggal sumber</dt><dd>${esc(c.date)}</dd></dl></div>`:''}<p class="dr-small dr-muted">Pada canvas ini perpindahan hanya ditunjukkan sebagai tujuan. Paket offline membuka preview modul. State contoh tidak dibagikan antarlayar.</p><div class="dr-modalfoot"><button type="button" class="dr-outline" data-close>Kembali ke review</button></div></div>`)}
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
    if(b.type==='submit'&&['dr-draftform','dr-promotionform'].includes(b.form?.id)){e.preventDefault();b.form.dispatchEvent(new SubmitEvent('submit',{bubbles:true,cancelable:true,submitter:b}));return}
    if('close'in ds){close();return}if('home'in ds){moduleInfo('Home','Kembali ke Home');return}
    if('retry'in ds){design.condition='terisi';render();say('Data contoh berhasil dibaca kembali. Jurnal dan draft dipertahankan.');return}

    if(ds.deletedraft){modal('Hapus atau tidak gunakan draft?',`<div class="dr-modalbody"><p>${esc(drafts.find(d=>d.id===ds.deletedraft).judul)}</p><p class="dr-small dr-muted">Hapus menghilangkan draft dari daftar. Tidak digunakan menyimpannya sebagai histori. Keduanya tidak mengubah sumber.</p><div class="dr-modalfoot"><button type="button" data-close>Batal</button><button type="button" class="dr-outline" data-discard="${ds.deletedraft}">Tidak digunakan</button><button type="button" class="dr-outline dr-danger" data-confirmdelete="${ds.deletedraft}">Hapus draft</button></div></div>`);return}

    if(f.id==='dr-draftform'){const d={...v,status:'draft',source_entity_type:f.dataset.sourceType||null,source_entity_id:f.dataset.sourceId||null};if(f.dataset.id){const old=drafts.find(d=>d.id===f.dataset.id);if(old?.status!=='draft'){err.textContent='Histori draft tidak dapat diubah.';return}Object.assign(old,d)}else drafts.push({...d,id:'p'+sequence++});close();render();q('[data-newdraft]').focus();say('Draft tersimpan. Belum membuat target atau mengubah sumber.');return}

  });

</div><p class="reference-note">Toolbar acuan bukan UI produk. Data contoh bersifat sementara; pindah halaman atau reload mengembalikannya. Lihat GAPS.md untuk flow yang belum dirancang.</p><script>
(() => {
  const config = {"id": "weekly-review", "label": "Weekly Review", "source": "dailys-weekly-review.html", "root": "dailys-review", "state": "review", "kind": "global", "description": "Dua jurnal, ringkasan live/snapshot, kandidat, draft/promotion dan beban tujuh hari."};

  api.render();

    const header = root.querySelector('header');
    const button = document.createElement('button');
    button.type='button'; button.textContent='Settings'; button.dataset.globalSettings='';
    button.style.cssText='min-height:44px;font:inherit;font-size:12px;padding:8px 12px;flex-shrink:0';
    header.style.flexWrap='wrap';
    header.append(button);
  }
  root.addEventListener('click', event => {
    const button = event.target.closest('[data-global-settings],[data-settings],[data-route]');
    if (!button) return;
    let destination;
    if(button.hasAttribute('data-global-settings')) destination='settings.html';
    else if(button.hasAttribute('data-settings')) destination='settings.html#dg-'+(config.root==='dailys-work'?'pomodoro':'sync');
    else if(config.id==='settings') destination=button.dataset.route+'.html';
    if(!destination) return;
    event.preventDefault();event.stopImmediatePropagation();location.href=destination;
  },true);
  if(config.id==='settings' && location.hash.startsWith('#dg-')) api.setSection(location.hash.slice(4));

  const icons = {
    house: '<path d="m3 10 9-7 9 7v11h-6v-7H9v7H3z"/>',
    'clipboard-list': '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 15h6"/>',
    timer: '<circle cx="12" cy="14" r="8"/><path d="M9 2h6m-3 0v4m6 1 2-2m-8 5v4l3 2"/>',
    wallet: '<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M15 10h6v5h-6zM3 8h18"/>',
    'list-checks': '<path d="m3 6 2 2 3-4m3 2h10M3 13l2 2 3-4m3 2h10M3 20l2 2 3-4m3 2h10"/>'
  };
  root.querySelectorAll('[data-lucide]').forEach(node => {
    const path = icons[node.dataset.lucide];
    if (!path) return;
    node.outerHTML = '<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
  });

  const destinations = {Home:'home', Tugas:'tugas', Pomodoro:'pomodoro', Keuangan:'keuangan', Habit:'habit'};
  root.querySelectorAll('nav button').forEach(button => {
    const label = Object.keys(destinations).find(key => button.textContent.trim().endsWith(key));
    if (!label) return;
    button.disabled = false;
    button.dataset.referenceDestination = destinations[label];
    if (destinations[label] === config.id) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  root.querySelectorAll('.dh-navcaption,.dw-navnote,.dl-navnote').forEach(node => {
    node.textContent = 'Acuan lima layar · data contoh';
  });
  root.addEventListener('click', event => {
    const button = event.target.closest('[data-reference-destination]');
    if (!button) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    const destination = button.dataset.referenceDestination;
    if (destination !== config.id) location.href = destination + '.html';
  }, true);

  document.getElementById('reference-condition').addEventListener('change', event => {
    state.condition = event.target.value;
    api.render();
  });
  if (config.root === 'dailys-sync') root.addEventListener('click', event => {
    const button = event.target.closest('[data-onboardhome]');
    if (!button) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    location.href = 'home.html';
  }, true);
  if (config.root === 'dailys-review') root.addEventListener('click', event => {
    const button = event.target.closest('[data-home],[data-candidate]');
    if (!button) return;
    const candidate = api.getCandidates().find(candidate => candidate.id === button.dataset.candidate);
    const destination = button.hasAttribute('data-home') ? 'home' : destinations[candidate?.module];
    if (!destination) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    location.href = destination + '.html';
  }, true);
  if (config.root === 'dailys-home') root.addEventListener('click', event => {
    if (!event.target.closest('#dh-reviewopen')) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    location.href = 'weekly-review.html';
  }, true);
  root.addEventListener('click', event => {
    if (event.target.closest('[data-retry]')) document.getElementById('reference-condition').value='terisi';
  });
})();
</script></body></html>
