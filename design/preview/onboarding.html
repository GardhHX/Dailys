 function renderReview(id){const r=reviews.find(r=>r.id===id);if(['resolved','discarded'].includes(r.status)){route=null;renderConflicts();return}const chosen=r.groups.filter(g=>r.choices[g.id]).length,locked=r.status==='submitted';

 function submitReview(id){const r=reviews.find(r=>r.id===id);if(r.revision!==r.serverRevision){r.revision=r.serverRevision;r.change=null;r.reason='server_changed';delete r.choices[r.groups[0].id];r.status='pending_review';close();render();say('Server berubah. Draft lokal ditinjau ulang dari base terbaru.',true);return}

 function manualSync(){if(busy||['offline','revoked','recovery'].includes(design.scenario))return;if(design.scenario==='failure'){say('Server belum dapat dihubungi. Perubahan lokal tetap tersimpan; retry tidak mengganti identitas request.',true);return}if(design.scenario==='unregistered'){onboarding.registration='active';design.scenario='attention';say('Perangkat terdaftar pada simulasi. Antrean lokal tetap tersedia.');render();return}

 function rejectedForm(id){modal('Perbaiki perubahan',`<form id="ds-rejectedform"><div class="ds-modalbody"><h3>${rejected.find(r=>r.id===id).title}</h3><p>Perubahan ditolak karena kategori sudah diarsipkan. Mengulang request yang sama tidak memperbaikinya.</p><label>Kategori aktif<select name="category"><option value="belanja">Belanja</option><option value="makanan">Makanan</option></select></label><p>Nominal tetap Rp75.000, pengeluaran dari Uang tunai. Koreksi dibuat sebagai perubahan baru.</p></div><div class="ds-modalfoot"><button type="button" data-close>Batal</button><button type="submit" class="ds-primary">Simpan perbaikan</button></div></form>`);q('#ds-rejectedform').onsubmit=e=>{e.preventDefault();const category=new FormData(e.target).get('category');rejected.find(r=>r.id===id).status='corrected';pending.push({id:'corrected-'+(++serial),title:'Pembelian buku',type:'Transaksi',detail:'Rp75.000 · Kategori '+(category==='belanja'?'Belanja':'Makanan')+' · Perubahan baru'});close();render();say('Perbaikan masuk antrean dengan identitas perubahan baru.')};}
 function renderRecovery(){let html=`<button type="button" class="ds-back" data-gosync>‹ Pusat Sync</button><div class="ds-head"><div><h1>Pemulihan sync</h1><p>Data server berubah atau riwayat sync lama tidak tersedia.</p></div><span class="ds-lock">${snapshotComplete?'Write dibuka; kandidat tetap review':'Write ditahan selama salin/snapshot'}</span></div>`;

    const button = event.target.closest('[data-home],[data-candidate]');
    if (!button) return;
    const candidate = api.getCandidates().find(candidate => candidate.id === button.dataset.candidate);
    const destination = button.hasAttribute('data-home') ? 'home' : destinations[candidate?.module];
    if (!destination) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    location.href = destination + '.html';
  }, true);
  if (config.root === 'dailys-home') root.addEventListener('click', event => {
    if (!event.target.closest('#dh-reviewopen')) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    location.href = 'weekly-review.html';
  }, true);
  root.addEventListener('click', event => {
    if (event.target.closest('[data-retry]')) document.getElementById('reference-condition').value='terisi';
  });
})();
</script></body></html>
