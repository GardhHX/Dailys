 function habitDetail(id){const h=habits.find(h=>h.id===id);if(!h)return;modal('Detail Habit',`<div class="dh-modalbody"><h3>${escape(h.name)}</h3><p class="dh-muted">Streak ${h.base+(h.logs[today]==='done'?1:0)} target hari · ${date===today?'Hari ini':pretty(date)}</p><p>${h.days.map(n=>['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'][n-1]).join(', ')}</p><label>Catatan hari ini<textarea id="dh-habitnote" placeholder="Catatan opsional">${escape(h.notes[today]||'')}</textarea></label><div class="dh-detailactions">${date===today&&eligible(h,date)?`<button data-habitdone="${h.id}" class="dh-primary">Tandai selesai</button><button data-habitskip="${h.id}" ${h.logs[today]==='skip'?'disabled':''}>Izin hari ini</button>`:''}</div><p class="dh-small dh-muted">Sisa izin minggu ini: ${h.logs[today]==='skip'?0:1}. Izin tidak menambah atau memutus streak.</p></div><div class="dh-modalfoot"><button data-cancel>Tutup</button></div>`)}
 function taskDetail(id){const t=tasks.find(t=>t.id===id);modal('Detail Tugas',`<div class="dh-modalbody"><h3>${escape(t.title)}</h3><dl class="dh-detailmeta"><dt>Mata kuliah</dt><dd>${escape(t.course)}</dd><dt>Deadline</dt><dd>${pretty(t.due,{day:'numeric',month:'long',year:'numeric'})} · ${t.time} WIB</dd><dt>Countdown</dt><dd>${taskDue(t)}</dd><dt>Prioritas</dt><dd>${t.priority}</dd><dt>Status</dt><dd>${labels[t.status]}</dd></dl><label>Ubah status<select id="dh-taskstatus"><option value="belum_dikerjakan" ${t.status==='belum_dikerjakan'?'selected':''}>Belum dikerjakan</option><option value="progress" ${t.status==='progress'?'selected':''}>Progress</option><option value="selesai" ${t.status==='selesai'?'selected':''}>Selesai</option></select></label></div><div class="dh-modalfoot"><button data-cancel>Tutup</button><button class="dh-primary" data-tasksave="${id}">Simpan status</button></div>`)}
 function review(){modal('Weekly review · 7–13 Sep',`<form id="dh-reviewform"><div class="dh-modalbody"><p class="dh-muted dh-small">${reviewCompleted?'Review selesai. Ringkasan dibekukan; jurnal tetap dapat diedit.':'Planning minggu depan dikunci mulai Minggu 09.00 sampai review selesai.'}</p><label>Evaluasi minggu ini<textarea name="evaluation" required placeholder="Tuliskan evaluasi minggu ini">${escape(reviewText.evaluation)}</textarea></label><label>Fokus minggu depan<textarea name="focus" required placeholder="Tuliskan fokus minggu depan">${escape(reviewText.focus)}</textarea></label><p id="dh-reviewerror" class="dh-error" role="alert"></p></div><div class="dh-modalfoot"><button type="button" data-cancel>Tutup</button><button type="submit" class="dh-primary">${reviewCompleted?'Simpan jurnal':'Selesaikan review'}</button></div></form>`);q('#dh-reviewform').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);if(!String(f.get('evaluation')).trim()||!String(f.get('focus')).trim()){q('#dh-reviewerror').textContent='Isi evaluasi dan fokus minggu depan.';return}reviewText={evaluation:f.get('evaluation'),focus:f.get('focus')};reviewCompleted=true;close();q('#dh-reviewstatus').textContent='Review selesai · 7–13 Sep. Planning minggu depan terbuka.';say('Weekly review tersimpan di preview.')}}
 root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;const ds=b.dataset;if(ds.mode){mode=ds.mode;render()}else if(ds.date){date=ds.date;render()}else if(ds.item)itemDetail(ds.item);else if(ds.task)taskDetail(ds.task);else if(ds.habit)habitDetail(ds.habit);else if(ds.slot)form('timebox',ds.slot);else if('add'in ds)form();else if('cancel'in ds)close();else if('retry'in ds){settings.condition='terisi';render();say('Data lokal berhasil dibaca.')}else if('home'in ds){date=today;mode='timeline';render()}else if(ds.edit)form('manual',null,getItem(ds.edit));else if(ds.command){const [action,id]=ds.command.split('|'),i=items.find(i=>i.id===id);if(action==='start')i.actualStart=now;else if(action==='complete'){i.status='completed';i.actualEnd=i.actualStart>=now?i.end:now}else{i.status=action==='skip'?'skipped':'missed';delete i.actualStart;delete i.actualEnd}close();render();say(action==='start'?'Block dimulai. Activity tidak memiliki status berjalan.':action==='complete'?'Timebox selesai. Rencana dan satu Activity hasil tampil sebagai satu unit.':'Outcome Timebox tercatat untuk satu kejadian.')}else if(ds.manualaction){const [status,id]=ds.manualaction.split('|');getItem(id).status=status;close();render();say('Status aktivitas diperbarui.')}else if(ds.habitdone||ds.habitskip){const h=habits.find(h=>h.id===(ds.habitdone||ds.habitskip));const note=q('#dh-habitnote').value;close();habitSet(h,ds.habitdone?'done':'skip',note)}else if(ds.tasksave){tasks.find(t=>t.id===ds.tasksave).status=q('#dh-taskstatus').value;close();render();say('Status tugas tersimpan.')}else if(ds.reschedule){const i=getItem(ds.reschedule);modal('Jadwalkan ulang Timebox',`<form id="dh-rescheduleform"><div class="dh-modalbody"><h3>${escape(i.title)}</h3><label>Tanggal baru<input type="date" name="date" required value="${today}"></label><label>Mulai<input type="time" name="start" required value="14:00"></label><p id="dh-rescheduleerror" role="alert" class="dh-error"></p></div><div class="dh-modalfoot"><button type="button" data-cancel>Batal</button><button type="submit" class="dh-primary">Simpan jadwal baru</button></div></form>`);q('#dh-rescheduleform').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target),d=f.get('date'),s=f.get('start'),minutes=v=>Number(v.slice(0,2))*60+Number(v.slice(3)),end=minutes(s)+minutes(i.end)-minutes(i.start);const e=String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0');if(end>=1440||d<today||(d===today&&s<now)||items.some(v=>v.id!==i.id&&v.date===d&&v.status==='pending'&&v.start&&s<v.end&&e>v.start)){q('#dh-rescheduleerror').textContent='Pilih waktu yang belum lewat dan tidak bertabrakan dengan Timebox aktif.';return}i.status='rescheduled';items.push({...i,id:'res'+(++serial),date:d,start:s,end:e,status:'pending',actualStart:undefined,actualEnd:undefined});close();render();say('Histori asal dipertahankan; Timebox baru dibuat.')}}});
 root.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.manual){getItem(el.dataset.manual).status=el.checked?'selesai':'belum_mulai';render();say('Status aktivitas diperbarui.')}if(el.dataset.habitcheck)habitSet(habits.find(h=>h.id===el.dataset.habitcheck),el.checked?'done':'missed')});
 q('#dh-add').onclick=()=>form();q('#dh-reviewopen').onclick=review;q('#dh-prev').onclick=()=>{date=addDays(date,mode==='week'?-7:-1);render()};q('#dh-next').onclick=()=>{date=addDays(date,mode==='week'?7:1);render()};q('#dh-date').onchange=ev=>{if(ev.target.value){date=ev.target.value;render()}};
 function design(){root.style.colorScheme=settings.appearance==='otomatis'?'light dark':settings.appearance==='terang'?'light':'dark';const dark=settings.appearance==='gelap'||settings.appearance==='otomatis'&&matchMedia('(prefers-color-scheme:dark)').matches;q('#dh-theme').textContent=dark?'Tema terang':'Tema gelap';render()}
 q('#dh-theme').onclick=()=>{settings.appearance=getComputedStyle(root).getPropertyValue('--dh-bg').trim()==='#17181e'?'terang':q('#dh-theme').textContent==='Tema gelap'?'gelap':'terang';design()};
 design();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:design});tweak.addSelect(settings,'appearance',{label:'Tema',options:['otomatis','terang','gelap']});tweak.addSelect(settings,'condition',{label:'Kondisi data',options:['terisi','kosong','memuat','gagal']})}
 root.dailysPreview={settings,render:design,items,tasks,habits};
})();
</script>
